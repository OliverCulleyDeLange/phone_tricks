name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Cancel in-progress runs for the same ref when a new commit lands.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (commonTest + JNI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK 27.1.12297006
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" >/dev/null

      - name: Run commonTest + Android unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Build native (CMake / Superpowered) for all ABIs
        run: ./gradlew :composeApp:externalNativeBuildDebug --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: composeApp/build/reports

  ios:
    name: iOS Simulator (commonTest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run commonTest + iOS simulator tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: composeApp/build/reports
